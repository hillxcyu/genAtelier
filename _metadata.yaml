file_type: demo
type: application
title: GenFashion Atelier AI Creative Studio for Fashion Retail
thumbnail_summary: Automate virtual try-on, brand DNA extraction, lookbooks, and personalized campaigns for fashion retail using Vertex AI Gemini models and Cloud Run.
purpose: |
  Built for **Chief Digital Officers, Merchandising VPs, and Retail Creative Directors**, this interactive application demonstrates how to eliminate weeks-long studio photoshoot and campaign localization bottlenecks across seasonal fashion drops.

  During a live customer pitch, sellers ingest a live retailer storefront URL to dynamically recalibrate the studio theme and catalog, walk shoppers through photorealistic virtual try-on with AI styling cross-sells, transform flat-lay shots into editorial on-model photography, and generate persona-targeted campaigns in minutes.
business_value: |
  * **Compress Creative Time-to-Market:** Shrinks seasonal lookbook, editorial model photography, and campaign asset production from 4–6 weeks of physical studio shoots to under 5 minutes.
  * **Lift E-Commerce Conversion & Basket Size:** Combines photorealistic virtual try-on with real-time AI outfit recommendations to reduce fit uncertainty and drive multi-item cart additions.
  * **Scale Hyper-Personalized Merchandising:** Adapts visual creative and marketing copy instantaneously across distinct shopper personas while maintaining strict brand aesthetic consistency.
technical_value: |
  * **Multimodal Brand DNA Extraction:** Pairs a Puppeteer Stealth sidecar with Gemini Flash structured JSON output to parse live storefront HTML into a 5-role color palette, typography, mood, and product catalog.
  * **Grounded Generative Imaging Pipeline:** Orchestrates Gemini Pro Image and Gemini Flash via a server-side Vertex AI proxy to power garment-to-person virtual try-on, product-to-model synthesis, and PDF lookbook export.
  * **Argolis-Compliant Multi-Container Serverless:** Runs unified frontend, Express API, and scraper sidecar containers on Cloud Run with internal load-balancer ingress behind an External HTTPS Load Balancer and IAP.

steps:
  # 1. Build App Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/gen-fashion-atelier:${SHORT_SHA}', '.']

  # 2. Build Scraper Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/gen-fashion-scraper:${SHORT_SHA}', 'scraper-service']

  # 3. Push App Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/gen-fashion-atelier:${SHORT_SHA}']

  # 4. Push Scraper Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/gen-fashion-scraper:${SHORT_SHA}']

  # 5. Prepare service.yaml with project and image tags
  - name: 'ubuntu'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|YOUR_PROJECT_ID|${PROJECT_ID}|g" service.yaml
        sed -i "s|YOUR_REGION|${_REGION}|g" service.yaml
        sed -i "s|YOUR_ARTIFACT_REPO|${_ARTIFACT_REPO}|g" service.yaml
        sed -i "s|gen-fashion-atelier:latest|gen-fashion-atelier:${SHORT_SHA}|g" service.yaml
        sed -i "s|gen-fashion-scraper:latest|gen-fashion-scraper:${SHORT_SHA}|g" service.yaml

  # 6. Deploy to Cloud Run using service.yaml
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'service.yaml'
      - '--region=${_REGION}'

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: gen-fashion-atelier

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/gen-fashion-atelier:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/gen-fashion-scraper:${SHORT_SHA}'

options:
  machineType: 'E2_HIGHCPU_8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run server
    ports:
      - "3001:3001"
    environment:
      - GEMINI_API_KEY=AIzaSyBPDGsPqqZmLAPuWXP_e-nSSqvgp4SdZao
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
    volumes:
      - .:/app
      - /app/node_modules
      - ../new_service_key.json:/tmp/adc.json:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_TARGET=http://backend:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
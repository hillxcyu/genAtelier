services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run server
    ports:
      - "3001:3001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - SCRAPER_SERVICE_URL=http://scraper:4000/scrape
    volumes:
      - .:/app
      - /app/node_modules
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    depends_on:
      - scraper

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_TARGET=http://backend:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

  scraper:
    build:
      context: ./scraper-service
      dockerfile: Dockerfile
    ports:
      - "4000:4000"

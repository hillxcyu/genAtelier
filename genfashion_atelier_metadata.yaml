purpose: GenFashion Atelier is an AI-powered creative workspace designed to revolutionize
  the fashion workflow. By leveraging Google's Gemini models, it enables brands to
  ingest their catalog, generate high-fidelity virtual try-ons, create automated lookbooks,
  and launch personalized marketing campaigns.

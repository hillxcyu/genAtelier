title: GenFashion Atelier
type: application
industries:
- Retail
- Consumer Goods
technical_value: This demo showcases a multi-modal Generative AI application architecture
  on Google Cloud. It utilizes Vertex AI's Gemini models for image generation, text
  processing, and logical reasoning. The application is containerized and deployed
  on Cloud Run using a multi-container pattern, demonstrating scalable serverless
  deployment.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gen-fashion-atelier
  labels:
    cloud.googleapis.com/location: YOUR_REGION
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: YOUR_RUNTIME_SERVICE_ACCOUNT
      containers:
        - name: app
          image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_ARTIFACT_REPO/gen-fashion-atelier:latest
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "YOUR_PROJECT_ID"
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
            - name: SCRAPER_SERVICE_URL
              value: "http://localhost:4000/scrape"
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
        - name: scraper
          image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_ARTIFACT_REPO/gen-fashion-scraper:latest
          env:
            - name: PORT
              value: "4000"
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
